name: SkillBridge CI Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-build:
    name: Frontend Quality Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run ESLint Check
        run: npx eslint .

      - name: Run Vite Build Verification
        run: npm run build
        env:
          VITE_API_BASE_URL: https://skillbridge-api.onrender.com

  backend-check:
    name: Backend Integrity Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: npm ci

      - name: Comprehensive Codebase Syntax Audit
        run: |
          find . -maxdepth 3 -name "*.js" -not -path "*/node_modules/*" -exec node -c {} +

      - name: Run Test Suite
        run: npm test -- --runInBand --forceExit
        env:
          NODE_ENV: test
          JWT_SECRET: ci_dummy_test_secret_12345
