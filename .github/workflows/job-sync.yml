name: Scheduled Job Sync

on:
  schedule:
    # Every 6 hours. Adjust as needed - GitHub Actions cron times are in UTC
    # and may run a few minutes late during high-load periods; that's fine here.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}  # allows manually triggering a run from the GitHub Actions tab too

jobs:
  trigger-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up backend (Warmup)
        run: |
          RAW_URL="${{ secrets.BACKEND_URL }}"
          BACKEND_URL="${RAW_URL%/}"
          echo "Pinging backend server at $BACKEND_URL/api/health..."
          for i in 1 2 3; do
            code=$(curl -s -L -o /dev/null -w "%{http_code}" --max-time 45 "$BACKEND_URL/api/health" || echo "000")
            echo "Warmup attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Backend is active and responding."
              break
            fi
            sleep 5
          done

      - name: Call backend sync endpoint
        run: |
          RAW_URL="${{ secrets.BACKEND_URL }}"
          BACKEND_URL="${RAW_URL%/}"
          echo "Triggering scheduled sync at $BACKEND_URL/api/jobs/internal-sync..."
          response=$(curl -s -L -o /tmp/response.json -w "%{http_code}" \
            --max-time 300 \
            -X POST "$BACKEND_URL/api/jobs/internal-sync" \
            -H "x-requested-with: XMLHttpRequest" \
            -H "x-sync-secret: ${{ secrets.SYNC_SECRET_KEY }}")

          echo "HTTP status: $response"
          cat /tmp/response.json
          echo ""

          if [ "$response" -ge 400 ] || [ "$response" = "000" ]; then
            echo "❌ Sync request failed with HTTP $response"
            if [ "$response" = "401" ]; then
              echo "🔑 Unauthorized: Check that SYNC_SECRET_KEY in GitHub Repository Secrets matches SYNC_SECRET_KEY in Render Environment Variables."
            fi
            if [ "$response" = "000" ]; then
              echo "🌐 Network Timeout/Unreachable: Check that BACKEND_URL in GitHub Repository Secrets is reachable."
            fi
            exit 1
          fi
