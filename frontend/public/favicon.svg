<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="bridgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4" />

  <!-- Subtle ambient inner glow -->
  <circle cx="256" cy="256" r="160" fill="#3B82F6" opacity="0.16" />

  <!-- Modern Geometric 'S' & Bridge Emblem -->
  <!-- Top Bridge Span / S-curve upper -->
  <path d="M 155 185 C 155 145, 195 130, 250 130 L 310 130 C 355 130, 385 160, 385 200 C 385 240, 345 260, 290 260 L 225 260 C 170 260, 130 285, 130 335 C 130 385, 165 410, 235 410 L 330 410 C 355 410, 375 395, 375 375" 
        fill="none" 
        stroke="url(#bridgeGrad)" 
        stroke-width="36" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Bridge Suspension Arc / Connectivity Beam -->
  <path d="M 150 355 Q 256 225 365 355" 
        fill="none" 
        stroke="url(#accentGrad)" 
        stroke-width="18" 
        stroke-linecap="round" 
        opacity="0.95" />

  <!-- Synapse / Talent Connection Nodes -->
  <circle cx="150" cy="355" r="15" fill="#38BDF8" />
  <circle cx="256" cy="245" r="18" fill="#FFFFFF" />
  <circle cx="365" cy="355" r="15" fill="#60A5FA" />
</svg>