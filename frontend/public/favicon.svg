<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="canvasGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#0A0F1D" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Left Arch Ribbon (Indigo -> Royal Blue) -->
    <linearGradient id="ribbonLeft" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Right Arch Ribbon (Royal Blue -> Vibrant Cyan) -->
    <linearGradient id="ribbonRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Central Bridge Deck Beam -->
    <linearGradient id="deckGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with premium border highlight -->
  <rect width="512" height="512" rx="120" fill="url(#canvasGrad)" />
  <rect width="506" height="506" x="3" y="3" rx="117" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="3" />

  <!-- Ambient Light Reflection inside squircle -->
  <circle cx="256" cy="180" r="140" fill="#4F46E5" opacity="0.18" />
  <circle cx="340" cy="340" r="120" fill="#06B6D4" opacity="0.14" />

  <!-- Architectural Bridge Structure -->
  <!-- Left Pillar & Soaring Arch -->
  <path d="M 120 380 L 120 250 C 120 180, 170 130, 240 130 C 275 130, 305 145, 325 170" 
        fill="none" 
        stroke="url(#ribbonLeft)" 
        stroke-width="40" 
        stroke-linecap="round" />

  <!-- Right Pillar & Descending Arch -->
  <path d="M 392 132 L 392 262 C 392 332, 342 382, 272 382 C 237 382, 207 367, 187 342" 
        fill="none" 
        stroke="url(#ribbonRight)" 
        stroke-width="40" 
        stroke-linecap="round" />

  <!-- Central Bridge Deck / Horizon Span -->
  <path d="M 110 256 L 402 256" 
        fill="none" 
        stroke="url(#deckGrad)" 
        stroke-width="26" 
        stroke-linecap="round" />

  <!-- Keystone / Talent Connection Beacon -->
  <circle cx="256" cy="256" r="24" fill="#FFFFFF" filter="url(#subtleGlow)" />
  <circle cx="256" cy="256" r="14" fill="#38BDF8" />

  <!-- Anchor Cable Accents -->
  <circle cx="120" cy="256" r="8" fill="#FFFFFF" opacity="0.9" />
  <circle cx="392" cy="256" r="8" fill="#FFFFFF" opacity="0.9" />
</svg>